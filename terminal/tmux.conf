# Essential NeoVim settings
set -sg escape-time 0
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ag terminal-features ",xterm-256color:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Enable mouse support (scrolling, pane selection, resizing)
set -g mouse on

# Clipboard: pipe through merlin-clip which writes OSC 52 directly to the
# client TTY. tmux's built-in Ms capability double-escapes the sequence,
# so we bypass it and use merlin-clip for all copy operations.
set -g set-clipboard on
set -g allow-passthrough on

# Mouse drag select → copy to browser clipboard via merlin-clip
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "merlin-clip copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "merlin-clip copy"

# Vi copy-mode yank → copy to browser clipboard via merlin-clip
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "merlin-clip copy"

# Key bindings
bind-key -n F2 new-window
bind-key -n F3 previous-window
bind-key -n F4 next-window
bind-key -n F5 kill-window

# General
set -g history-limit 50000
set -g renumber-windows on

# Status bar — dark, minimal, Dracula-inspired
set -g status-style "bg=#1e1e2e,fg=#6272a4"
set -g status-left ""
set -g status-right ""

# Tabs — agent-state pills, gated on the per-window @agent_state var.
#
# When @agent_state is set (idle|busy|done), the pill encodes the running
# agent's state in the GLYPH (colorblind-safe) with colour as reinforcement:
#   ○  idle  (grey  #6272a4) — no turn running / waiting on nothing
#   ◐  busy  (amber #f9e2af) — the agent is working
#   ●  done  (green #a6e3a1) — finished, waiting on you (clears on visit/leave)
# The active window adds a background highlight (#313244) and, when idle,
# purple (#bd93f9) so "you are here" is a third channel independent of glyph
# and colour. When @agent_state is UNSET (shell / Codex / OpenCode / any
# non-Claude window), the pill falls back byte-for-byte to the classic
# ○ inactive / ● active, so there is zero regression for those windows.
#
# Set by terminal/hooks/agent-state.sh (driven by the Claude Code hooks the
# reconciler installs). The done-pill is cleared by agent-state-switch.sh.
#
# NOTE: the active format uses two separate #[bg=..]#[fg=..] blocks rather
# than one #[bg=..,fg=..]. A literal comma inside #[...] collides with the
# #{?...} ternary's own comma separator and truncates the pill; splitting the
# style keeps every comma inside protected #{...} braces.
set -g window-status-format         "#{?#{@agent_state},#[fg=#{?#{==:#{@agent_state},done},#a6e3a1,#{?#{==:#{@agent_state},busy},#f9e2af,#6272a4}}] #{?#{==:#{@agent_state},done},●,#{?#{==:#{@agent_state},busy},◐,○}} , ○ }"
set -g window-status-current-format "#{?#{@agent_state},#[bg=#313244]#[fg=#{?#{==:#{@agent_state},done},#a6e3a1,#{?#{==:#{@agent_state},busy},#f9e2af,#bd93f9}}] #{?#{==:#{@agent_state},done},●,#{?#{==:#{@agent_state},busy},◐,○}} , ● }"
set -g window-status-style "fg=#6272a4,bg=#1e1e2e"
set -g window-status-current-style "fg=#bd93f9,bg=#1e1e2e"

# Clear the green done-pill on window change. Registered on
# session-window-changed (fires on ALL switch methods, incl. mouse-clicking a
# pill in the web terminal) with after-select-window as redundancy (F3/F4).
# The script lives in terminal/hooks/, located via $MERLIN_TERMINAL_HOOKS which
# terminal/routes.py exports before launching tmux. No-op if the var is unset.
set-hook -g session-window-changed 'run-shell "\"$MERLIN_TERMINAL_HOOKS/agent-state-switch.sh\""'
set-hook -g after-select-window    'run-shell "\"$MERLIN_TERMINAL_HOOKS/agent-state-switch.sh\""'

# Load user config if it exists
source-file -q ~/.tmux.conf
