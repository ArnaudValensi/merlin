{% extends "base.html" %}
{% block title %}term{% endblock %}

{% block content %}
<div class="nt-page">
    <div id="nt-container"></div>
    <button id="nt-jump" class="nt-jump" type="button" hidden>Jump to bottom</button>
    <textarea id="nt-input" class="nt-input" rows="1" aria-label="Terminal input"></textarea>
</div>
<div id="nt-toolbar" class="nt-toolbar">
    <div class="nt-toolbar-row">
        <button class="tk" type="button" data-key="Escape">Esc</button>
        <button class="tk" type="button" data-key="Tab">Tab</button>
        <button class="tk" type="button" data-key="ShiftTab">⇧Tab</button>
        <button class="tk tk-mod" type="button" data-mod="ctrl">Ctrl</button>
        <button class="tk tk-mod" type="button" data-mod="alt">Alt</button>
        <button class="tk tk-mod" type="button" data-mod="shift">Shift</button>
        <button class="tk" type="button" data-key="Enter">↵</button>
        <span class="nt-toolbar-sep"></span>
        <button class="tk" type="button" data-key="F3" title="Previous window">◀</button>
        <button class="tk" type="button" data-action="new-window" title="New window in current directory">+</button>
        <button class="tk" type="button" data-key="F4" title="Next window">▶</button>
        <button class="tk" type="button" data-key="F5" title="Close window">✕</button>
        <span class="nt-toolbar-sep"></span>
        <button class="tk tk-arrow" type="button" data-key="ArrowLeft" data-repeat>&larr;</button>
        <button class="tk tk-arrow" type="button" data-key="ArrowUp" data-repeat>&uarr;</button>
        <button class="tk tk-arrow" type="button" data-key="ArrowDown" data-repeat>&darr;</button>
        <button class="tk tk-arrow" type="button" data-key="ArrowRight" data-repeat>&rarr;</button>
    </div>
</div>
<div id="nt-status" class="nt-status">
    <span id="nt-dot" class="nt-dot"></span>
    <span id="nt-status-text">Connecting...</span>
</div>
{% endblock %}

{% block scripts %}
<link rel="stylesheet" href="/static/vendor/geistmono-nerd-font.css">
<link rel="stylesheet" href="/static/terminal/native/native.css">
<style>
    html, body { overflow: hidden !important; overscroll-behavior: none; height: 100%; }
    .mobile-topbar { display: none !important; }
    .main {
        padding: 0 !important;
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        min-height: 0 !important;
        overflow: hidden;
    }
    .main-banners:empty { display: none; }
    .nt-page { position: relative; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
    #nt-container { position: relative; flex: 1 1 auto; min-height: 0; display: flex; }
    /* The input field is real and focusable (a phone opens its keyboard on
       it) but invisible: the terminal's own cursor shows where typing goes. */
    .nt-input {
        position: absolute; left: 0; bottom: 0; width: 1px; height: 1em;
        opacity: 0; border: 0; padding: 0; margin: 0; resize: none; font-size: 16px;
        caret-color: transparent; color: transparent; background: transparent;
        z-index: -1;
    }
    .nt-toolbar {
        background: var(--bg-secondary); border-top: 1px solid var(--border);
        flex: 0 0 auto; padding: 6px 8px;
    }
    .nt-toolbar-row {
        display: flex; gap: 4px; align-items: center; overflow-x: auto;
        scrollbar-width: none; -ms-overflow-style: none;
    }
    .nt-toolbar-row::-webkit-scrollbar { display: none; }
    .nt-toolbar-sep { width: 1px; height: 20px; background: var(--border); margin: 0 2px; flex-shrink: 0; }
    .nt-toolbar .tk {
        font-family: 'GeistMono Nerd Font', 'Geist Mono', monospace; font-size: 12px; font-weight: 500;
        padding: 0 10px; height: 32px; display: flex; align-items: center; justify-content: center;
        white-space: nowrap; border: 1px solid var(--border); border-radius: 6px;
        background: var(--bg-card); color: var(--text-secondary); cursor: pointer; flex-shrink: 0;
        -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
        touch-action: manipulation;
    }
    .nt-toolbar .tk:active { background: var(--bg-hover); color: var(--text-primary); }
    .nt-toolbar .tk-mod.active {
        background: rgba(74, 158, 255, 0.15); border-color: rgba(74, 158, 255, 0.4); color: var(--accent-blue);
    }
    .nt-toolbar .tk-arrow { font-size: 14px; padding: 0 8px; }
    .nt-status {
        display: flex; gap: 8px; align-items: center; padding: 4px 10px;
        font-size: 12px; color: var(--text-muted, #6272a4); background: var(--bg-secondary, #1e1e2e);
        flex: 0 0 auto;
    }
    /* The composition being typed (an IME), at the terminal's cursor. */
    .nt-preedit {
        position: absolute; z-index: 5; pointer-events: none; white-space: pre;
        font-family: 'GeistMono Nerd Font', 'Geist Mono', monospace; font-size: 11px;
        line-height: 14px; color: var(--text-primary, #f8f8f2); background: var(--bg-card, #282a36);
        text-decoration: underline;
    }
    .nt-dot { width: 8px; height: 8px; border-radius: 50%; background: #f1fa8c; flex: 0 0 auto; }
    .nt-dot.connected { background: #50fa7b; }
    .nt-dot.disconnected { background: #ff5555; }
</style>
<script src="/static/vendor/xterm.min.js"></script>
<script src="/static/vendor/xterm-addon-unicode11.min.js"></script>
<script src="/static/terminal/native/core.js"></script>
<script src="/static/terminal/native/renderer.js"></script>
<script src="/static/terminal/native/engine.js"></script>
<script src="/static/terminal/native/input.js"></script>
<script src="/static/terminal/native/toolbar.js"></script>
<script>{% include "session-identity.js" %}</script>
<script>
(function () {
    'use strict';
    const container = document.getElementById('nt-container');
    const jump = document.getElementById('nt-jump');
    const field = document.getElementById('nt-input');
    const dot = document.getElementById('nt-dot');
    const statusText = document.getElementById('nt-status-text');
    let attempted = null;
    let confirmed = false;
    let delay = 1000;
    let stopped = false;
    let current = null;
    // The last text a program copied (merlin-clip, OSC 52, tmux's own copy):
    // what Ctrl+Shift+C copies when nothing is selected.
    let lastClip = null;
    let flashTimer = null;

    let statusLine = '';
    function status(state, text) {
        dot.className = 'nt-dot ' + state;
        statusLine = text;
        if (!flashTimer) statusText.textContent = text;
    }
    // A short message in the status line, then the status again.
    function flash(text) {
        clearTimeout(flashTimer);
        statusText.textContent = text;
        flashTimer = setTimeout(() => { flashTimer = null; statusText.textContent = statusLine; }, 2500);
    }

    const engine = new MerlinNativeTerminal({
        container,
        wsUrl: () => {
            attempted = MerlinSessionIdentity.read();
            confirmed = false;
            return MerlinSessionIdentity.websocketUrl(location, attempted).replace('/ws/terminal', '/ws/terminal2');
        },
        onOpen: () => { delay = 1000; status('connected', 'Connected'); },
        onControl: (msg) => {
            if (msg.type === 'session') {
                if (MerlinSessionIdentity.confirm(msg)) confirmed = true;
                current = msg;
                document.title = (msg.name || 'term') + (msg.window ? ': ' + msg.window : '');
                status('connected', msg.name + (msg.window ? ' : ' + msg.window : ''));
            } else if (msg.type === 'paste_refused') {
                flash(msg.reason || 'Paste refused');
            } else if (msg.type === 'unsupported') {
                stopped = true;
                status('disconnected', 'This tmux (' + (msg.version || 'unknown') + ') is older than '
                    + msg.minimum + ': use the classic terminal');
            }
        },
        onClipboard: (text) => {
            lastClip = text;
            if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).catch(() => {});
        },
        onStuck: (stuck) => { jump.hidden = stuck; },
        onClose: (e) => {
            if (e.code === 4401) { stopped = true; status('disconnected', 'Unauthorized: reload the page'); return; }
            MerlinSessionIdentity.clearAfterClose(attempted, confirmed, e.code);
            if (stopped) return;
            status('disconnected', 'Disconnected');
            setTimeout(() => engine.connect(), delay);
            delay = Math.min(delay * 2, 30000);
        },
    });
    const modifiers = new MerlinNativeInput.Modifiers();
    function hasSelection() {
        const sel = getSelection();
        return !!(sel && !sel.isCollapsed && sel.rangeCount && sel.getRangeAt(0).intersectsNode(container));
    }
    const input = new MerlinNativeInput(field, engine, {
        modifiers,
        hasSelection,
        cursorRect: () => {
            const c = container.querySelector('.nt-cursor');
            return c && c.isConnected ? c.getBoundingClientRect() : null;
        },
        // Ctrl+Shift+C: the selection, else the last text a program copied.
        copy: () => {
            const text = engine.selectionText() || lastClip;
            if (!text) return;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => flash('Copied!'), () => flash('Copy failed'));
            }
        },
        // Images are uploaded and their path typed by the parity milestone.
        onPasteFiles: () => flash('Image paste: use the classic terminal for now'),
    });
    const toolbar = new MerlinNativeToolbar(document.getElementById('nt-toolbar'), engine, {
        modifiers,
        focus: () => input.focus(),
        // The Sessions panel's create-and-switch path when it is on the page,
        // else the F2 binding.
        newWindow: (btn) => {
            const board = window.SessionsBoard;
            if (board && board.openNewWindow && current) {
                btn.disabled = true;
                Promise.resolve(board.openNewWindow(current.name)).finally(() => { btn.disabled = false; });
            } else {
                engine.key('F2');
            }
        },
        onWindowKey: () => {
            if (window.SessionsBoard && window.SessionsBoard.refresh) setTimeout(() => window.SessionsBoard.refresh(), 300);
        },
    });
    // ?suggestions=1 (or 0) turns the keyboard's suggestions on (or off) for
    // this browser.
    const wanted = new URLSearchParams(location.search).get('suggestions');
    if (wanted === '1' || wanted === '0') input.setSuggestions(wanted === '1');
    window.MerlinNativeTerminalPage = { engine, input, toolbar, modifiers, current: () => current };

    jump.addEventListener('click', () => { engine.toBottom(); input.focus(); });
    // A tap or a click focuses the input field, unless it ends a selection or
    // hits a link.
    container.addEventListener('click', (e) => {
        if (e.target.closest('a')) return;
        const sel = getSelection();
        if (sel && !sel.isCollapsed) return;
        input.focus();
    });
    field.addEventListener('focus', () => container.classList.add('nt-focused'));
    field.addEventListener('blur', () => container.classList.remove('nt-focused'));
    status('connecting', 'Connecting...');
    engine.connect();
    if (!matchMedia('(pointer: coarse)').matches) input.focus();
})();
</script>
{% endblock %}
