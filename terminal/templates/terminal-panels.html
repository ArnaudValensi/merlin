{#- The panels and dialogs around the terminal, shared by the classic and the
   native pages. -#}
<!-- Sessions board: fullscreen modal on mobile, a docked resizable panel on
     desktop (the divider drags the boundary; collapse hides it). -->
<div id="sessions-divider" class="sessions-divider" title="Drag to resize"></div>
<div id="sessions-backdrop" class="sessions-backdrop"></div>
<aside id="sessions-panel" class="sessions-panel" aria-label="Sessions"></aside>
{% if app_enabled %}
<!-- App stream: docked panel on desktop, floating mini-player on mobile. -->
<div id="app-divider" class="app-divider" title="Drag to resize" hidden></div>
<aside id="app-panel" class="app-panel" aria-label="App stream" hidden></aside>
{% endif %}
<!-- Notifications popover: opened by the bell in the status bar. -->
<div id="notif-popover" class="notif-popover" role="dialog" aria-label="Notifications" hidden></div>

<!-- Voice console: covers the terminal while voice mode is on, or moves over
     the status bar as a bar when the terminal stays visible. -->
<div id="voice-console" role="dialog" aria-modal="true" aria-label="Voice mode" hidden></div>

<!-- Folder picker modal (shared component) — used here to cd the terminal -->
<div id="folder-picker-modal" class="picker-modal" role="dialog" aria-modal="true" aria-label="Change directory" style="display:none">
    <div class="picker-overlay"></div>
    <div class="picker-container">
        <div class="picker-drag-handle"></div>
        <div class="picker-header">
            <h3>Change directory</h3>
            <button id="picker-close" class="back-btn" title="Close">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
        </div>
        <div class="picker-search-wrap">
            <input type="text" id="picker-search" class="picker-search" placeholder="Search projects..." aria-label="Search projects">
        </div>
        <div id="picker-breadcrumbs" class="picker-breadcrumbs"></div>
        <div id="picker-content" class="picker-content"></div>
        <div id="picker-footer" class="picker-footer" style="display:none">
            <button id="picker-use-btn" class="picker-use-btn">Use this folder</button>
        </div>
    </div>
</div>
