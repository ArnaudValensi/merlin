[project]
name = "merlin"
version = "0.12.0"
description = "Portable mobile dev environment"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "asyncssh",
    "cron-descriptor>=2.1.0",
    "croniter",
    "discord.py",
    "fastapi",
    "faster-whisper; sys_platform != 'darwin' or platform_machine == 'arm64'",
    "httpx",
    "jinja2",
    "pydantic",
    "python-dotenv",
    "python-multipart",
    "pyyaml",
    "uvicorn[standard]",
    "zipstream-ng",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.ruff.lint]
ignore = [
    "E402",  # module-level import not at top — needed after sys.path setup
    "E731",  # lambda assignment — acceptable in tests and config
    "E741",  # ambiguous variable name — `l` in comprehensions is fine
]

[tool.ty.src]
exclude = [
    "tests",
    "merlin-bot/tests",
]

[tool.ty.environment]
# Mirrors sys.path.insert calls in main.py (lines 49, 851) so ty can resolve
# imports like `from structured_log import ...` and `import merlin_bot`.
extra-paths = ["lib", "merlin-bot"]
