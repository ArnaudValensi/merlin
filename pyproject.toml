[project]
name = "merlin"
version = "0.12.0"
description = "Portable mobile dev environment"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "asyncssh",
    "cron-descriptor>=2.1.0",
    "croniter",
    "fastapi",
    "faster-whisper; sys_platform != 'darwin' or platform_machine == 'arm64'",
    "httpx",
    "jinja2",
    "pydantic",
    "python-dotenv",
    "python-multipart",
    "pywebpush>=2.5.0",
    "pyyaml",
    "uvicorn[standard]",
    "zipstream-ng",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.ruff.lint]
# Ruff's default `select` broadened in newer releases (0.16.x turns on
# isort, pyupgrade, bugbear, and more out of the box). Declare the classic
# default explicitly so `validate` is reproducible across ruff versions
# instead of drifting when an unpinned uvx ruff resolves to a newer one.
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E402",  # module-level import not at top — needed after sys.path setup
    "E731",  # lambda assignment — acceptable in tests and config
    "E741",  # ambiguous variable name — `l` in comprehensions is fine
]

[tool.ty.src]
exclude = [
    "tests",
    # Runs under the system Python (PyGObject + python-xlib), which the
    # project environment does not have: see app/deps.py.
    "app/streamer.py",
    # A PEP 723 script with its own dependencies (kokoro-onnx, onnxruntime),
    # run with `uv run --script`, never imported by Merlin.
    "tools/kokoro-tts-server.py",
]

[tool.ty.environment]
# Mirrors the sys.path.insert in main.py so ty can resolve imports like
# `from structured_log import ...`.
extra-paths = ["lib"]
