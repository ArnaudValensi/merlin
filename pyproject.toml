[project]
name = "merlin"
version = "0.12.0"
description = "Portable mobile dev environment"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "asyncssh",
    "croniter",
    "discord.py",
    "fastapi",
    "faster-whisper; sys_platform != 'darwin' or platform_machine == 'arm64'",
    "httpx",
    "jinja2",
    "pydantic",
    "python-dotenv",
    "python-multipart",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]
