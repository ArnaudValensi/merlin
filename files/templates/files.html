{% extends "base.html" %}

{% block title %}Files — Merlin Dashboard{% endblock %}

{% block content %}
<link rel="stylesheet" href="/static/files/files.css">
<link rel="stylesheet" href="/static/vendor/hljs-github-dark-dimmed.min.css">

<div id="files-app" data-startup-cwd="{{ startup_cwd or '' }}">
    <!-- View 1: Directory Listing -->
    <div id="dir-view" class="files-view">
        <div id="dir-header" class="files-header">
            <h2>Files</h2>
            <div class="files-header-actions">
                <button id="create-btn" class="header-action-btn" aria-label="Create new file or folder" title="Create new">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </button>
                <button id="select-btn" class="header-action-btn" aria-label="Select files" title="Select items">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                </button>
                <button id="upload-btn" class="header-action-btn" aria-label="Upload files" title="Upload files">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                </button>
                <button id="download-dir-btn" class="header-action-btn" aria-label="Download directory" title="Download directory" style="display:none">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                </button>
                <input id="upload-input" type="file" multiple style="display:none">
                <a id="git-commits-btn" class="git-commits-btn" style="display:none" title="View commits">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>
                </a>
            </div>
        </div>
        <!-- Selection mode header (hidden by default) -->
        <div id="selection-header" class="selection-header" style="display:none">
            <button id="selection-close-btn" class="back-btn" aria-label="Exit selection mode" title="Cancel selection">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
            <span id="selection-count" class="selection-count">0 selected</span>
            <div class="selection-actions">
                <button id="download-sel-btn" class="header-action-btn" style="display:none" aria-label="Download selected items" title="Download">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                </button>
                <button id="rename-btn" class="header-action-btn" style="display:none" aria-label="Rename selected item" title="Rename">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/></svg>
                </button>
                <button id="delete-sel-btn" class="header-action-btn btn-danger" style="display:none" aria-label="Delete selected items" title="Delete">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                </button>
            </div>
        </div>
        <!-- Delete confirmation bar (hidden by default) -->
        <div id="delete-confirm" class="delete-confirm" style="display:none">
            <span id="delete-confirm-msg" class="delete-confirm-msg"></span>
            <div class="delete-confirm-actions">
                <button id="delete-cancel-btn" class="delete-cancel-btn">Cancel</button>
                <button id="delete-confirm-btn" class="delete-confirm-real-btn">Delete</button>
            </div>
        </div>
        <div class="breadcrumbs-row">
            <div id="breadcrumbs" class="breadcrumbs"></div>
        </div>
        <div id="upload-progress" class="upload-progress" style="display:none">
            <div class="upload-progress-bar">
                <div id="upload-progress-fill" class="upload-progress-fill"></div>
            </div>
            <div id="upload-progress-text" class="upload-progress-text"></div>
        </div>
        <div id="dir-entries" class="dir-entries"></div>
        <div id="dir-empty" class="empty-state" style="display:none">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            <p>Empty directory</p>
            <div class="empty-actions">
                <button id="empty-create-btn" class="empty-action-btn" aria-label="Create a file">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Create a file
                </button>
                <button id="empty-upload-btn" class="empty-action-btn" aria-label="Upload files">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    Upload
                </button>
            </div>
        </div>
        <div id="dir-error" class="error-state" style="display:none">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>
            <p id="dir-error-msg"></p>
        </div>
        <div id="dir-loading" class="loading-indicator">Loading...</div>
    </div>

    <!-- View 2: File Viewer -->
    <div id="file-view" class="files-view" style="display:none">
        <div class="files-header" id="file-header">
            <button id="file-back-btn" class="back-btn" title="Back to directory">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <div class="file-meta" id="file-meta"></div>
            <div class="file-actions" id="file-actions">
                <div class="nav-cluster" id="file-nav-cluster" style="display:none">
                    <button id="file-prev-btn" class="header-action-btn" aria-label="Previous file" title="Previous file (←)">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                    </button>
                    <span id="file-counter" class="file-counter" aria-live="polite" aria-atomic="true"></span>
                    <button id="file-next-btn" class="header-action-btn" aria-label="Next file" title="Next file (→)">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                    </button>
                </div>
                <button id="md-toggle" class="wrap-toggle-btn" title="Toggle markdown rendering" style="display:none">Raw</button>
                <button id="wrap-toggle" class="wrap-toggle-btn" title="Toggle line wrap" style="display:none">Wrap</button>
                <a id="download-link" class="download-btn" title="Download file">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                </a>
                <button id="file-rename-btn" class="header-action-btn" aria-label="Rename file" title="Rename">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/></svg>
                </button>
                <button id="file-delete-btn" class="header-action-btn btn-danger" aria-label="Delete file" title="Delete">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                </button>
            </div>
        </div>
        <!-- File viewer delete confirmation (hidden by default) -->
        <div id="file-delete-confirm" class="delete-confirm" style="display:none">
            <span class="delete-confirm-msg">Delete this file?</span>
            <div class="delete-confirm-actions">
                <button id="file-delete-cancel" class="delete-cancel-btn">Cancel</button>
                <button id="file-delete-go" class="delete-confirm-real-btn">Delete</button>
            </div>
        </div>
        <div id="file-content" class="file-content"></div>
        <div id="file-loading" class="loading-indicator" style="display:none">Loading file...</div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/vendor/highlight.min.js"></script>
<script src="/static/vendor/marked.min.js"></script>
<script type="importmap">
{
    "imports": {
        "three": "/static/vendor/three/three.module.min.js",
        "three/addons/": "/static/vendor/three/"
    }
}
</script>
<script type="module" src="/static/files/files-3d.js"></script>
<script src="/static/files/audio-audition.js"></script>
<script src="/static/files/files.js"></script>
{% endblock %}
